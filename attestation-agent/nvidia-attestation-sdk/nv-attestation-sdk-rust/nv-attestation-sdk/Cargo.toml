[package]
name = "nv-attestation-sdk"
version = "1.2.0"
edition = "2021"
authors = ["NVIDIA Corporation"]
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/attestation-sdk/nv-attestation-sdk-rust"
keywords = ["nvidia", "attestation", "security", "gpu"]
categories = ["api-bindings", "hardware-support"]
description = "Safe Rust bindings for the NVIDIA Attestation SDK"
documentation = "https://docs.nvidia.com/attestation/nv-attestation-sdk-rust/latest/overview.html"

[dependencies]
nv-attestation-sdk-sys = { version = "1.2.0", path = "../nv-attestation-sdk-sys" }
log = { version = "0.4", optional = true }

[dev-dependencies]
log = "0.4"
env_logger = "0.11"

[features]
default = []
logging = ["log"]

[[example]]
name = "logging_example"
required-features = ["logging"]
